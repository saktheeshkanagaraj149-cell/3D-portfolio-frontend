# Render Blueprint for the portfolio API.
# Render dashboard → New → Blueprint → pick this repo. It creates (or updates) the web service
# below; you'll be asked for the values marked sync: false.
services:
  - type: web
    name: threed-portfolio-frontend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: https://3-d-portfolio-frontend-wheat.vercel.app
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_TO
        sync: false
